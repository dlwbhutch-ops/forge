name: HOUSE Commander Lab Android

on:
  push:
    branches:
      - house-commander-lab-v05
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout HOUSE branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Maven 3.8.1
        run: |
          curl -L -o apache-maven-3.8.1-bin.tar.gz \
            https://archive.apache.org/dist/maven/maven-3/3.8.1/binaries/apache-maven-3.8.1-bin.tar.gz
          tar xf apache-maven-3.8.1-bin.tar.gz
          echo "$GITHUB_WORKSPACE/apache-maven-3.8.1/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK 35
        run: |
          yes | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager \
            --sdk_root=${ANDROID_SDK_ROOT} \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Forge Android Maven plugin
        run: |
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2

          curl -L -o android-maven-plugin-4.6.2.jar \
            https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar

          curl -L -o android-maven-plugin-4.6.2.pom \
            https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom

      - name: Install Forge dependencies
        run: |
          export _JAVA_OPTIONS="-Xmx2g"
          mvn -B install -Dmaven.test.skip=true

      - name: Build HOUSE Android debug APK
        continue-on-error: true
        run: |
          export _JAVA_OPTIONS="-Xmx2g --add-exports=java.base/sun.security.pkcs=ALL-UNNAMED --add-exports=java.base/sun.security.x509=ALL-UNNAMED --add-exports=java.base/sun.security.util=ALL-UNNAMED"
          set +e
          mvn -s "$GITHUB_WORKSPACE/.mvn/local-settings.xml" -U -B clean verify \
            -pl forge-gui-android -am \
            -P android-debug \
            -Dandroid.sdk.path=${ANDROID_SDK_ROOT} \
            -Dandroid.buildToolsVersion=35.0.0 \
            -Dmaven.test.skip=true \
            2>&1 | tee "$GITHUB_WORKSPACE/house-maven.log"
          echo "${PIPESTATUS[0]}" > "$GITHUB_WORKSPACE/house-maven-exit.txt"
          exit 0

      - name: Show generated files
        if: always()
        run: |
          find forge-gui-android/target -maxdepth 1 -type f -print || true
          CODE="$(cat house-maven-exit.txt 2>/dev/null || echo 1)"
          if [ "$CODE" -ne 0 ]; then
            echo "===== LAST 80 MAVEN LOG LINES ====="
            tail -n 80 house-maven.log || true
            ERR="$(tail -n 80 house-maven.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=HOUSE Android Maven failure::$ERR"
            exit "$CODE"
          fi

      - name: Sign HOUSE APK
        run: |
          APK="$(find forge-gui-android/target -maxdepth 1 -type f -name '*.apk' ! -name '*debugSigned*' | head -n 1)"
          echo "APK to sign: $APK"
          test -n "$APK"
          java -jar forge-gui-android/tools/uber-apk-signer.jar -a "$APK" --debug
          echo "===== SIGNED APK ====="
          find forge-gui-android/target -maxdepth 1 -type f -name '*debugSigned*.apk' -print

      - name: Upload HOUSE APK
        uses: actions/upload-artifact@v4
        with:
          name: HOUSE-Commander-Lab-Android
          path: |
            forge-gui-android/target/*debugSigned*.apk
            forge-gui-android/target/assets.zip
          if-no-files-found: error
