name: Test build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    name: Test with Java ${{ matrix.Java }}
    steps:
      - uses: actions/checkout@v3

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: 'maven'

      - name: Synchronize the pinned HOUSE Forge engine and set data
        if: github.ref_name == 'feature/house-macos-art-validation-20261010' || github.head_ref == 'feature/house-macos-art-validation-20261010' || github.ref_name == 'fix/house-winner-verified-seat-20261010' || github.head_ref == 'fix/house-winner-verified-seat-20261010' || github.ref_name == 'fix/complete-token-gallery-20261010' || github.head_ref == 'fix/complete-token-gallery-20261010' || github.ref_name == 'fix/house-attack-worker-20261008' || github.head_ref == 'fix/house-attack-worker-20261008' || github.ref_name == 'feature/reality-fracture-complete-20261009' || github.head_ref == 'feature/reality-fracture-complete-20261009'
        run: python3 .github/scripts/refresh-house-forge.py

      - name: Install virtual framebuffer (if not available) to allow running GUI on a headless server
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Run tests in virtual framebuffer
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B clean test
